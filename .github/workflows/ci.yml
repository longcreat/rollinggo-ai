name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval
      - name: Install browser for current product flow
        run: npx playwright install --with-deps chromium
      - name: Verify current product flow with isolated databases and mocks
        run: npm run eval:flow
        env:
          EVAL_PG_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - name: Verify frozen knowledge roundtrip
        run: npm run eval:knowledge:verify -- --self-test
        env:
          EVAL_PG_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - name: Save evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: eval/runs/
          if-no-files-found: warn
          retention-days: 14
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Validate Docker Compose configuration
        run: cp .env.example .env && docker compose config
      - name: Build application container
        run: docker compose build app
      - name: Smoke test deployed stack
        shell: bash
        run: |
          set -euo pipefail

          master_key="$(openssl rand -hex 32)"
          sed -i "s/^MASTER_KEY=.*/MASTER_KEY=${master_key}/" .env

          cleanup() {
            # marker 是容器内进程写的，宿主机用户无权删除；先让容器自己删，down 之后再兜底一次
            docker compose exec -T app rm -f /app/data/media/share-posters/restart-marker 2>/dev/null || true
            docker compose down -v || true
            rm -f data/media/share-posters/restart-marker 2>/dev/null || true
          }
          trap cleanup EXIT

          wait_for_health() {
            for _ in {1..30}; do
              if curl --fail --silent http://127.0.0.1:${APP_PORT:-3001}/api/health | grep -q '"ok":true'; then
                return 0
              fi
              sleep 2
            done

            docker compose logs --no-color
            return 1
          }

          docker compose up -d
          wait_for_health

          docker compose exec -T app sh -c \
            "printf release-smoke > /app/data/media/share-posters/restart-marker"
          docker compose restart app
          wait_for_health

          test "$(docker compose exec -T app cat /app/data/media/share-posters/restart-marker)" = \
            "release-smoke"
